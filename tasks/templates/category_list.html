{% extends 'base.html' %}

{% block content %}
<h1 class="text-3xl font-bold mb-4">Category List</h1>

<a href="{% url 'category_create' %}" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded mb-4 inline-block">Create Category</a>

<div class="overflow-x-auto">
<table class="min-w-full divide-y divide-gray-200">
    <thead>
        <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for category in categories %}
        <tr class="{% if forloop.counter|divisibleby:2 %}bg-gray-50{% endif %}">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ category.name }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ category.description }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                <a href="{% url 'category_update' category.pk %}" class="text-blue-600 hover:text-blue-900 mr-2">Edit</a>
                <a href="{% url 'category_delete' category.pk %}" class="text-red-600 hover:text-red-900">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
