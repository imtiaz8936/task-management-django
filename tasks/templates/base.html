{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Event Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-100">

<nav class="bg-blue-500 text-white fixed top-0 left-0 w-full z-50 shadow-md">
    <div class="container mx-auto flex justify-between items-center p-4">

        <a href="{% url 'base' %}" class="text-xl font-bold">Event Manager</a>

        <button id="menu-toggle" class="md:hidden focus:outline-none">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>

        <div class="hidden md:flex space-x-6">
            <a href="{% url 'base' %}" class="hover:text-gray-300">Home</a>
            <a href="{% url 'event_list' %}" class="hover:text-gray-300">Events</a>
            <a href="{% url 'category_list' %}" class="hover:text-gray-300">Category</a>
            <a href="{% url 'participant_list' %}" class="hover:text-gray-300">Participant</a>
            <a href="{% url 'dashboard' %}" class="hover:text-gray-300">Dashboard</a>
        </div>
    </div>

    <div id="mobile-menu" class="md:hidden hidden px-4 pb-4 space-y-2 bg-blue-500">
        <a href="{% url 'base' %}" class="block hover:text-gray-300">Home</a>
        <a href="{% url 'event_list' %}" class="block hover:text-gray-300">Events</a>
        <a href="{% url 'category_list' %}" class="block hover:text-gray-300">Category</a>
        <a href="{% url 'participant_list' %}" class="block hover:text-gray-300">Participant</a>
        <a href="{% url 'dashboard' %}" class="block hover:text-gray-300">Dashboard</a>
    </div>
</nav>

<div class="px-4 mt-24">
    {% block content %}
    {% endblock %}
</div>

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("menu-toggle");
        const mobileMenu = document.getElementById("mobile-menu");

        if (toggleBtn && mobileMenu) {
            toggleBtn.addEventListener("click", function () {
                mobileMenu.classList.toggle("hidden");
            });
        }
    });
</script>
{% endblock %}

</body>
</html>
